<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Demo Validasi 3 Layer - Tambah Barang</title>
  </head>
  <body>
    <h2>Form Tambah Barang</h2>

    <!-- Form mengirim data via POST ke file simpan.php -->
    <form action="simpan.php" method="POST">
      <label for="nama">Nama Barang:</label><br />
      <input type="text" id="nama" name="nama_barang" required /><br /><br />

      <label for="jumlah">Jumlah Barang (Minimal 3):</label><br />
      <!-- Validasi Layer 1: Atribut min="3" menahan input <= 2 di browser -->
      <input
        type="number"
        id="jumlah"
        name="jumlah"
        min="3"
        required
      /><br /><br />

      <button type="submit">Simpan Data</button>
    </form>
  </body>
</html>
